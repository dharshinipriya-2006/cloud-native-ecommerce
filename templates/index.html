

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudKart | Smart Shopping</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f7f8fc;
            color: #172033;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: #2355e8;
        }

        .logo span {
            color: #172033;
        }

        .search {
            width: 38%;
            padding: 13px 18px;
            border: 1px solid #e1e5ed;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .search:focus {
            border-color: #2355e8;
        }

        .cart {
            background: #2355e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .hero {
            margin: 35px 7%;
            padding: 65px;
            border-radius: 22px;
            background: linear-gradient(120deg, #101c3a, #2355e8);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 300px;
        }

        .hero h1 {
            font-size: 43px;
            max-width: 520px;
            line-height: 1.2;
            margin-bottom: 17px;
        }

        .hero p {
            color: #dce5ff;
            margin-bottom: 25px;
        }

        .hero button {
            padding: 14px 25px;
            background: white;
            color: #2355e8;
            border: none;
            border-radius: 9px;
            font-weight: 800;
            cursor: pointer;
        }

        .hero-icon {
            font-size: 115px;
        }

        .categories {
            padding: 10px 7% 30px;
        }

        .category-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .category-btn {
            padding: 11px 20px;
            border: 1px solid #e0e5ef;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .category-btn.active,
        .category-btn:hover {
            background: #2355e8;
            color: white;
            border-color: #2355e8;
        }

        .products-section {
            padding: 25px 7% 65px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 27px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #edf0f5;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(25,50,100,0.09);
        }

        .product-image {
            height: 155px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f6ff;
            border-radius: 12px;
            font-size: 65px;
            margin-bottom: 17px;
        }

        .product-category {
            color: #7d8799;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .product-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .price {
            color: #2355e8;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #172033;
            color: white;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .add-btn:hover {
            background: #2355e8;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #7d8799;
        }

        footer {
            background: #101c3a;
            color: white;
            padding: 35px 7%;
            text-align: center;
        }

        footer p {
            color: #bdc8e0;
            margin-top: 10px;
            font-size: 13px;
        }

        @media(max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero {
                padding: 40px;
            }
        }

        @media(max-width: 600px) {
            header {
                padding: 15px 5%;
                flex-wrap: wrap;
                gap: 12px;
            }

            .search {
                width: 100%;
                order: 3;
            }

            .hero {
                margin: 20px 5%;
                padding: 30px;
            }

            .hero h1 {
                font-size: 29px;
            }

            .hero-icon {
                display: none;
            }

            .categories,
            .products-section {
                padding-left: 5%;
                padding-right: 5%;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-card {
                padding: 12px;
            }

            .product-image {
                height: 110px;
                font-size: 48px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Cloud<span>Kart.</span></div>

    <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="Search products..."
        oninput="displayProducts()"
    >

    <button class="cart" onclick="showCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <div>
        <h1>Everything You Love. One Smart Destination.</h1>
        <p>Discover quality products at prices you'll love.</p>
        <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
            Shop Now →
        </button>
    </div>

    <div class="hero-icon">🛍️</div>
</section>

<section class="categories">
    <h2>Explore Categories</h2>

    <div class="category-list">
        <button class="category-btn active" onclick="filterCategory('All', this)">All</button>
        <button class="category-btn" onclick="filterCategory('Electronics', this)">Electronics</button>
        <button class="category-btn" onclick="filterCategory('Fashion', this)">Fashion</button>
        <button class="category-btn" onclick="filterCategory('Accessories', this)">Accessories</button>
        <button class="category-btn" onclick="filterCategory('Home & Kitchen', this)">Home & Kitchen</button>
    </div>
</section>

<section class="products-section" id="products">

    <div class="section-heading">
        <h2>Popular Products</h2>
        <span>Discover our collection</span>
    </div>

    <div class="product-grid" id="productGrid">
        <p>Loading products...</p>
    </div>

</section>

<footer>
    <h2>CloudKart.</h2>
    <p>Smart Shopping. Better Living.</p>
    <p>© 2026 CloudKart. All rights reserved.</p>
</footer>

<script>
    let products = [];
    let selectedCategory = "All";
    let cart = [];

    async function loadProducts() {
        try {
            const response = await fetch("/api/products");

            if (!response.ok) {
                throw new Error("Unable to load products");
            }

            products = await response.json();
            displayProducts();

        } catch (error) {
            document.getElementById("productGrid").innerHTML =
                '<p class="empty">Unable to load products. Please refresh the page.</p>';
        }
    }

    function displayProducts() {
        const search = document.getElementById("searchInput").value.toLowerCase();

        const filtered = products.filter(product => {
            const matchesCategory =
                selectedCategory === "All" ||
                product.category === selectedCategory;

            const matchesSearch =
                product.name.toLowerCase().includes(search) ||
                product.category.toLowerCase().includes(search);

            return matchesCategory && matchesSearch;
        });

        const grid = document.getElementById("productGrid");

        if (filtered.length === 0) {
            grid.innerHTML = '<p class="empty">No products found.</p>';
            return;
        }

        grid.innerHTML = filtered.map(product => `
            <div class="product-card">
                <div class="product-image">${product.emoji}</div>

                <div class="product-category">${product.category}</div>

                <h3>${product.name}</h3>

                <div class="price">₹${product.price.toLocaleString("en-IN")}</div>

                <button class="add-btn" onclick="addToCart(${product.id})">
                    Add to Cart +
                </button>
            </div>
        `).join("");
    }

    function filterCategory(category, button) {
        selectedCategory = category;

        document.querySelectorAll(".category-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        displayProducts();
    }

    function addToCart(id) {
        const product = products.find(item => item.id === id);

        if (!product) return;

        cart.push(product);

        document.getElementById("cartCount").textContent = cart.length;

        alert(product.name + " added to your cart!");
    }

    function showCart() {
        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);

        const items = cart.map(item =>
            item.name + " - ₹" + item.price
        ).join("\n");

        alert(
            "YOUR CLOUDKART CART\n\n" +
            items +
            "\n\nTotal: ₹" + total.toLocaleString("en-IN")
        );
    }

    loadProducts();
</script>

</body>
</html>
