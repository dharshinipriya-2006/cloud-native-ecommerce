
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCart | Online Shopping</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .hero {
            padding: 55px 8%;
            background: #dbeafe;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #475569;
        }

        .products {
            padding: 35px 8%;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 22px;
        }

        .product {
            background: white;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px #0000000d;
        }

        .product .emoji {
            font-size: 55px;
        }

        .product button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
        }

        .product button:hover {
            background: #1d4ed8;
        }

        footer {
            padding: 22px;
            background: #172554;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>CloudCart</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h2>Welcome to CloudCart</h2>
        <p>Discover your favourite products in one place.</p>
    </section>

    <main class="products" id="products">
        <h2>Our Products</h2>
        <div class="product-grid" id="product-grid"></div>
    </main>

    <section class="products" id="cart">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items">Your cart is empty.</div>
        <h3 id="cart-total">Total: ₹0</h3>
    </section>

    <footer>
        <p>CloudCart — A Cloud-Native E-Commerce Project</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Headphones", price: 999, emoji: "🎧" },
            { id: 2, name: "Smart Watch", price: 1499, emoji: "⌚" },
            { id: 3, name: "Laptop Bag", price: 799, emoji: "🎒" },
            { id: 4, name: "Keyboard", price: 1199, emoji: "⌨️" }
        ];

        const cart = [];

        const productGrid = document.getElementById("product-grid");

        products.forEach(product => {
            const card = document.createElement("article");
            card.className = "product";

            const emoji = document.createElement("div");
            emoji.className = "emoji";
            emoji.textContent = product.emoji;

            const name = document.createElement("h3");
            name.textContent = product.name;

            const price = document.createElement("p");
            price.textContent = `₹${product.price}`;

            const button = document.createElement("button");
            button.textContent = "Add to Cart";
            button.addEventListener("click", () => addToCart(product.id));

            card.append(emoji, name, price, button);
            productGrid.appendChild(card);
        });

        function addToCart(productId) {
            const product = products.find(item => item.id === productId);
            cart.push(product);
            renderCart();
        }

        function renderCart() {
            document.getElementById("cart-count").textContent = cart.length;

            const cartItems = document.getElementById("cart-items");
            cartItems.replaceChildren();

            if (cart.length === 0) {
                cartItems.textContent = "Your cart is empty.";
            } else {
                cart.forEach(product => {
                    const item = document.createElement("p");
                    item.textContent = `${product.name} — ₹${product.price}`;
                    cartItems.appendChild(item);
                });
            }

            const total = cart.reduce((sum, product) => sum + product.price, 0);
            document.getElementById("cart-total").textContent =
                `Total: ₹${total.toLocaleString("en-IN")}`;
        }
    </script>
</body>
</html>
